name: Sync And Publish Android APK

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Force a build and release even if the version tag already exists
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: android-release-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: SagerNet/sing-box-for-android
  ORIGIN_MAIN_BRANCH: main
  UPSTREAM_BRANCH: main
  OVERLAY_BRANCH: overlay
  OVERLAY_APPLICATION_ID: ${{ vars.OVERLAY_APPLICATION_ID }}
  OVERLAY_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      should_push: ${{ steps.prepare.outputs.should_push }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      new_version: ${{ steps.prepare.outputs.new_version }}
      new_version_code: ${{ steps.prepare.outputs.new_version_code }}
      new_go_setup_version: ${{ steps.prepare.outputs.new_go_setup_version }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi

      - name: Detect upstream version
        id: prepare
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_android_release.sh --force
          else
            ./scripts/prepare_android_release.sh
          fi

      - name: Stop when release already exists
        if: steps.prepare.outputs.should_release != 'true'
        run: echo "Release ${{ steps.prepare.outputs.release_tag }} already exists."

  build-and-release:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.detect-release.outputs.new_go_setup_version }}
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108"

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release branch
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_android_release.sh --force
          else
            ./scripts/prepare_android_release.sh
          fi

      - name: Validate signing configuration
        run: |
          test -n "$LOCAL_PROPERTIES"
          test -n "$OVERLAY_APPLICATION_ID"
          test -n "$OVERLAY_GITHUB_REPOSITORY"
          if [[ -n "$RELEASE_KEYSTORE_BASE64" ]]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi
          test -f app/release.keystore

      - name: Restore Go libbox cache
        id: cache-go-libbox
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/pkg/gomobile
          key: ${{ runner.os }}-go-libbox-android-${{ needs.detect-release.outputs.new_version }}
          restore-keys: |
            ${{ runner.os }}-go-libbox-android-

      - name: Restore Libbox AAR cache
        id: cache-libbox-aar
        uses: actions/cache/restore@v5
        with:
          path: app/libs
          key: ${{ runner.os }}-libbox-aar-${{ needs.detect-release.outputs.new_version }}

      - name: Build Libbox AARs
        if: steps.cache-libbox-aar.outputs.cache-hit != 'true'
        run: ./scripts/build_libbox_android.sh "${{ needs.detect-release.outputs.new_version }}" "$GITHUB_WORKSPACE/app/libs"

      - name: Save Go libbox cache
        if: steps.cache-go-libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/pkg/gomobile
          key: ${{ steps.cache-go-libbox.outputs.cache-primary-key }}

      - name: Save Libbox AAR cache
        if: steps.cache-libbox-aar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: app/libs
          key: ${{ steps.cache-libbox-aar.outputs.cache-primary-key }}

      - name: Build release APKs
        run: ./gradlew :app:clean :app:assembleOtherRelease :app:assembleOtherLegacyRelease --stacktrace

      - name: Collect release assets
        run: |
          mkdir -p dist/release_android
          cp app/build/outputs/apk/other/release/*.apk dist/release_android/
          cp app/build/outputs/apk/otherLegacy/release/*.apk dist/release_android/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "version_code": int(os.environ["VERSION_CODE"]),
              "version_name": os.environ["VERSION_NAME"],
          }
          Path("dist/release_android/SFA-version-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          VERSION_CODE: ${{ needs.detect-release.outputs.new_version_code }}
          VERSION_NAME: ${{ needs.detect-release.outputs.new_version }}

      - name: Push synced branches
        if: needs.detect-release.outputs.should_push == 'true'
        run: |
          git push origin "${{ needs.detect-release.outputs.upstream_sha }}:refs/heads/${ORIGIN_MAIN_BRANCH}"
          git push --force-with-lease origin HEAD:refs/heads/${OVERLAY_BRANCH}

      - name: Publish GitHub release
        run: |
          tag="${{ needs.detect-release.outputs.release_tag }}"
          version="${{ needs.detect-release.outputs.new_version }}"
          notes_file="$RUNNER_TEMP/android-release-notes.md"
          {
            echo "Android APK build for sing-box $version."
            echo
            echo "Source: ${{ needs.detect-release.outputs.upstream_sha }}"
          } > "$notes_file"

          release_args=()
          if [[ "${{ needs.detect-release.outputs.prerelease }}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "SFA $version" --notes-file "$notes_file" "${release_args[@]}"
            gh release upload "$tag" dist/release_android/* --clobber
          else
            gh release create "$tag" dist/release_android/* \
              --target "$(git rev-parse HEAD)" \
              --title "SFA $version" \
              --notes-file "$notes_file" \
              "${release_args[@]}"
          fi
